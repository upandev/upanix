set timeout=15
set default=0 # Set the default menu entry

insmod efi_gop
insmod efi_uga
insmod font

if loadfont unicode
then
  insmod gfxterm
  set gfxmode=auto
  set gfxpayload=1024x768x32
  terminal_output gfxterm
fi

menuentry "Upanix64" {
  multiboot2 /efi/boot/upanix.elf   # The multiboot command replaces the kernel command
  boot
}
